<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação - De Olho no Lixo</title>
</head>
<body style="margin:0; padding:20px; background-color: #f4f4f4; font-family: 'Poppins', Arial, sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" role="presentation">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0" role="presentation" style="max-width:600px;">
                <tr>
                    <td style="padding:30px 15px;">
                        <table width="100%" cellpadding="0" cellspacing="0" role="presentation"
                               style="background: linear-gradient(180deg, #125c87 0%, #0a3044 100%); border-radius:12px; padding:28px; box-shadow: 0 6px 18px rgba(0,0,0,0.35);">

                            <tr>
                                <td style="color: #e0e0e0; text-align:left; padding:0 12px;">

                                    <h2 style="margin:0 0 8px 0; font-size:26px; color:#ffffff; font-weight:700;">Verificação de E-mail</h2>

                                    <p style="margin:0 0 18px 0; color: #e0e0e0; font-size:14px; line-height:1.5;">
                                        Olá <strong><span th:text="${username}"></span></strong>, obrigado por se cadastrar na <strong>De Olho no Lixo</strong>! Confirme seu e-mail usando o código abaixo:
                                    </p>

                                    <div style="text-align:center; margin:18px 0;">
                                        <div style="display:inline-block; padding:16px 22px; border-radius:8px; background:#000000; color:#fff; font-size:22px; font-weight:700; letter-spacing:4px;">
                                            <span th:text="${verificationCode}"></span>
                                        </div>
                                    </div>

                                    <p style="margin:18px 0 0 0; color: #e0e0e0; font-size:13px;">
                                        Este código expira em <strong>1 hora</strong>.
                                    </p>

                                    <p style="margin:26px 0 0 0; color: #e0e0e0; font-size:13px; line-height:1.4;">
                                        Abraços,<br/>
                                        Equipe De Olho no Lixo
                                    </p>

                                    <hr style="border:none; border-top:1px solid rgba(255,255,255,0.06); margin:24px 0;" />

                                    <p style="font-size:12px; color:rgba(255,255,255,0.6); text-align:center;">
                                        De Olho no Lixo © <span th:text="${currentYear}"></span>
                                    </p>

                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
