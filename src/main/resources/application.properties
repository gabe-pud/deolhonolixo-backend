# =============================================================
# Aplicação
# =============================================================
spring.application.name=DeOlhoNoLixo

# =============================================================
# PostgreSQL
# =============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =============================================================
# MongoDB
# =============================================================

spring.data.mongodb.uri=${SPRING_MONGO_URI}
spring.data.mongodb.database=${MONGO_DATABASE}
spring.data.mongodb.auto-index-creation=true

# =============================================================
# MQTT
# =============================================================

deolhonolixo.mqtt.url=${MQTT_BROKER_URL}
deolhonolixo.mqtt.topic=caminhao/+/dados
deolhonolixo.mqtt.qos=1

# =============================================================
# JWT
# =============================================================
api.security.token.secret=${SECRET_KEY_TOKEN}

# =============================================================
# SMTP
# =============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_EMAIL}
spring.mail.password=${SMTP_EMAIL_APP_KEY}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000